name: Build & Sign SamsungCallVault APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Locate or Extract Project Folder
        run: |
          echo "Checking repository structure..."
          ls -la
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              echo "Extracting $z..."
              unzip -o "$z"
            done
          fi
          if [ ! -d "app" ]; then
            SUBDIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1 | xargs -r dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Found Android project inside subfolder: $SUBDIR. Moving to root..."
              cp -r "$SUBDIR"/. .
            fi
          fi
          ls -la
          if [ ! -d "app" ]; then
            echo "ERROR: 'app' folder is missing! Please upload SamsungCallVault_S24Ultra_Android_Project.zip."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Self-Signed Release Keystore
        run: |
          mkdir -p app
          rm -f app/release-keystore.jks
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias callvault_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=SamsungCallVault, OU=Personal, O=GalaxyS24Ultra, L=Srinagar, S=JK, C=IN"
          echo "KEYSTORE_PASSWORD=android123" >> $GITHUB_ENV
          echo "KEY_ALIAS=callvault_key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android123" >> $GITHUB_ENV

      - name: Build Debug & Signed Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungCallVault-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungCallVault-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
